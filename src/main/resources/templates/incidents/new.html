<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Report an incident')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main class="content">
<p class="eyebrow">CAMPUS COMMUNITY SUPPORT</p><h1>Tell us what went wrong.</h1><p class="muted">We will calculate priority, set deadlines and look for a qualified technician.</p>
<form class="panel form-stack" th:action="@{/employee/incidents}" method="post" th:object="${form}"><div class="alert error" role="alert" th:if="${#fields.hasErrors('*')}"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div><label>Short title<input th:field="*{title}" maxlength="160" required placeholder="For example: Unable to connect to campus Wi-Fi"></label><label>Description<textarea th:field="*{description}" rows="6" maxlength="8000" required placeholder="What happened, where, and what have you tried?"></textarea></label>
<div class="form-grid"><label>Affected service<select th:field="*{service}" required><option th:each="s:${services}" th:if="${s['active']}" th:value="${s['id']}" th:text="${s['name']}"></option></select></label><label>Category<select th:field="*{category}" required><option th:each="c:${categories}" th:if="${c['active']}" th:value="${c['id']}" th:text="${c['name']}"></option></select></label>
<label>Impact<select th:field="*{impact}"><option value="1">1 · One user</option><option value="2">2 · Group / multiple users</option><option value="3">3 · Campus-wide / major interruption</option></select></label><label>Urgency<select th:field="*{urgency}"><option value="1">1 · Workaround available</option><option value="2">2 · Serious impairment</option><option value="3">3 · Work blocked / time-critical</option></select></label><label>Affected users<input th:field="*{affected}" type="number" min="1" max="2147483647" required></label></div><button class="button" type="submit">Submit incident →</button></form>
</main></div><script th:src="@{/js/app.js}" defer></script></body></html>
