<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Incidents')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main class="content">
<div class="page-heading"><div><p class="eyebrow">SERVICE OPERATIONS</p><h1 th:text="${viewer.role.name()=='TECHNICIAN'?'My assigned incidents':'Incidents'}"></h1><p class="muted">Search, track and resolve your campus IT incidents.</p></div><a class="button" th:if="${viewer.role.name()=='EMPLOYEE'}" th:href="@{/employee/incidents/new}">+ Report incident</a></div>
<form th:replace="~{fragments/filters :: filters('/incidents')}"></form>
<section class="panel table-panel"><div class="page-heading"><h2>Incident queue</h2><span class="badge" th:text="${total}+' results'"></span></div><div class="table-scroll"><table><thead><tr><th>Incident</th><th>Priority</th><th>Status</th><th>Service / category</th><th>Assignee</th><th>SLA</th></tr></thead><tbody><tr th:each="row:${rows}"><td><a th:href="@{/incidents/{id}(id=${row['id']})}" th:text="'INC-'+${row['id']}"></a><strong class="block" th:text="${row['title']}"></strong><small th:text="${@dates.format(row['created_at'])}"></small></td><td><span class="badge" th:classappend="${row['priority']=='P1'?'danger':''}" th:text="${row['priority']}"></span></td><td th:text="${row['status']}"></td><td><span th:text="${row['service_name']}"></span><small class="block muted" th:text="${row['category_name']}"></small></td><td th:text="${row['technician_name']?:'Awaiting assignment'}"></td><td th:text="${row['breached']?'Violation recorded':'No breach recorded'}"></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="6" class="muted">No incidents match these filters.</td></tr></tbody></table></div>
<div class="pagination"><button class="button secondary" th:disabled="${filter.page==0}" th:attr="data-page=${filter.page-1}">Previous</button><span th:text="'Page '+${filter.page+1}"></span><button class="button secondary" th:disabled="${(filter.page+1)*20>=total}" th:attr="data-page=${filter.page+1}">Next</button></div></section>
</main></div><script th:src="@{/js/app.js}" defer></script></body></html>
