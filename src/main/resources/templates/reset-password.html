<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>BITSOps password recovery</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><main class="auth-card"><h1>Choose a new password</h1><p>Reset links expire after 15 minutes and work once.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form th:action="@{/reset-password}" method="post"><input type="hidden" name="token" th:value="${token}"><label>New password<input name="password" type="password" minlength="8" maxlength="64" autocomplete="new-password" required></label><label>Confirm new password<input name="confirmation" type="password" minlength="8" maxlength="64" autocomplete="new-password" required></label><button class="button" type="submit">Reset password</button></form><p><a th:href="@{/login}">Back to sign in</a></p></main></body></html>
