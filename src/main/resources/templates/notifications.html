<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Notifications')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main class="content">
<p class="eyebrow">UPDATES</p><h1>Your notifications</h1><section class="panel"><article class="timeline-entry" th:each="n:${rows}"><span class="badge" th:text="${n['read_at']==null?'Unread':'Read'}"></span><h2 th:text="${n['subject']}"></h2><p th:text="${n['body']}"></p><small th:text="${@dates.format(n['created_at'])}"></small><a th:href="@{/incidents/{id}(id=${n['incident_id']})}">View incident</a><form th:if="${n['read_at']==null}" th:action="@{/notifications/{id}/read(id=${n['id']})}" method="post"><button class="text-button">Mark read</button></form></article><p class="muted" th:if="${#lists.isEmpty(rows)}">No notifications yet.</p></section>
</main></div><script th:src="@{/js/app.js}" defer></script></body></html>
