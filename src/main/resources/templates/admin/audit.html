<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Audit log')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main class="content"><p class="eyebrow">ADMINISTRATION</p><h1>Audit log</h1><p class="muted">Latest 300 actions. Read-only history.</p><section class="panel"><article class="timeline-entry" th:each="a:${rows}"><strong th:text="${a['action']}+' · '+${a['subject']}"></strong><small class="block" th:text="${a['actor_name']}+' · '+${@dates.format(a['created_at'])}"></small><p th:text="${a['description']}"></p></article></section></main></div><script th:src="@{/js/app.js}" defer></script></body></html>
