<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Simulated email')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main class="content"><p class="eyebrow">NOTIFICATION CHANNEL 2</p><h1>Simulated email deliveries</h1><p class="muted">These are persisted simulations. No external email has been sent.</p><section class="panel"><article class="timeline-entry" th:each="n:${rows}"><span class="badge">SIMULATED</span><strong th:text="${n['email']}"></strong><h2 th:text="${n['subject']}"></h2><p th:text="${n['body']}"></p><small th:text="${@dates.format(n['created_at'])}"></small></article><p class="muted" th:if="${#lists.isEmpty(rows)}">No simulated deliveries yet.</p></section></main></div><script th:src="@{/js/app.js}" defer></script></body></html>
