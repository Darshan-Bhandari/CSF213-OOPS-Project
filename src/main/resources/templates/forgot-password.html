<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>BITSOps password recovery</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><main class="auth-card"><h1>Forgot password</h1><p>Reset links expire after 15 minutes and work once.</p><div class="alert" th:if="${sent}">If an active account exists with this email, a reset link will be sent. Check your inbox or contact your administrator.</div><form th:action="@{/forgot-password}" method="post"><label>Email<input name="email" type="email" maxlength="254" autocomplete="email" required></label><button class="button" type="submit">Send reset link</button></form><p><a th:href="@{/login}">Back to sign in</a></p></main></body></html>
