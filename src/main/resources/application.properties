spring.application.name=campus-itsm
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campus_itsm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campus_itsm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.model=${OPENROUTER_MODEL:}

# Recovery is independently configurable; normal startup needs no mail credentials.
app.recovery.mode=${RECOVERY_MODE:disabled}
app.recovery.from=${RECOVERY_FROM:}
app.recovery.base-url=${APP_BASE_URL:http://127.0.0.1:8080}
app.recovery.directory=${RECOVERY_DIRECTORY:.local/recovery-mail}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
