spring.application.name=campus-itsm
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campus_itsm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campus_itsm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.model=${OPENROUTER_MODEL:}
